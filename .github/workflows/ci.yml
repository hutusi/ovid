name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check app
        run: bunx tsc --noEmit

      - name: Type-check tests
        run: bunx tsc -p tsconfig.test.json --noEmit

      - name: Lint
        run: bun run lint

      - name: Check whitespace
        run: bun run check:whitespace

      - name: Test with coverage
        run: bun test --coverage --coverage-reporter=text --coverage-reporter=lcov | tee coverage-output.txt

      - name: Publish TS coverage summary
        if: always()
        run: |
          {
            echo "## TypeScript Coverage";
            echo '```';
            cat coverage-output.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build frontend
        run: bun run build

  validate-rust:
    name: Validate Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libappindicator3-dev \
            libglib2.0-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            patchelf \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust backend with coverage
        run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --summary-only | tee coverage-rust.txt

      - name: Check generated command types
        run: git diff --exit-code src/lib/commands/generated

      - name: Publish Rust coverage summary
        if: always()
        run: |
          {
            echo "## Rust Coverage";
            echo '```';
            cat coverage-rust.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
